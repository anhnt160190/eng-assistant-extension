<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-title">English Assistant</div>
    <button class="header-settings" id="btn-settings" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <!-- Tab Bar -->
  <nav class="tab-bar" role="tablist">
    <button role="tab" aria-selected="true" data-tab="phrase">Phrase</button>
    <button role="tab" aria-selected="false" data-tab="words">Words</button>
    <button role="tab" aria-selected="false" data-tab="review">Review</button>
  </nav>

  <!-- Tab Content -->
  <main class="content">
    <section id="tab-phrase" role="tabpanel" class="tab-panel active"></section>
    <section id="tab-words" role="tabpanel" class="tab-panel"></section>
    <section id="tab-review" role="tabpanel" class="tab-panel"></section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="stat stat-accent" id="stat-streak">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
      </svg>
      <span id="streak-count">0</span>
    </div>
    <div class="stat" id="stat-words">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
      </svg>
      <span id="words-count">0</span>
    </div>
    <div class="stat" id="stat-due">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <span id="due-count">0</span>
    </div>
  </footer>

  <!-- Settings Overlay -->
  <div class="settings-overlay hidden" id="settings-overlay">
    <div class="settings-header">
      <button class="settings-back" id="btn-settings-close" aria-label="Close settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="settings-title">Settings</div>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-section-label">Active Sites</div>
        <div class="settings-row">
          <span class="settings-row-label">Slack</span>
          <label class="toggle">
            <input type="checkbox" id="toggle-slack" checked>
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="settings-row">
          <span class="settings-row-label">Gmail</span>
          <label class="toggle">
            <input type="checkbox" id="toggle-gmail" checked>
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="settings-row">
          <span class="settings-row-label">Jira</span>
          <label class="toggle">
            <input type="checkbox" id="toggle-jira" checked>
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-label">Theme</div>
        <div class="theme-options">
          <button class="theme-btn active" data-theme="auto">Auto</button>
          <button class="theme-btn" data-theme="light">Light</button>
          <button class="theme-btn" data-theme="dark">Dark</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
